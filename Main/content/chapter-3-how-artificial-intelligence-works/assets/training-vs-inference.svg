<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 405" width="900" height="405" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Training versus inference</title><desc id="d">During training the model weights change using a large dataset and an error signal. During inference the weights are frozen and the model turns a prompt into an answer.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="1" y="1" width="898" height="403" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<text x="450" y="36" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">Training vs. inference</text><rect x="30" y="60" width="410" height="290" rx="10" fill="#fff8f2" stroke="#fb8f44" stroke-width="2"/><rect x="460" y="60" width="410" height="290" rx="10" fill="#f2f9ff" stroke="#54aeff" stroke-width="2"/><text x="235" y="92" font-size="17" font-weight="bold" text-anchor="middle" fill="#bc4c00" font-family="Segoe UI, Helvetica, Arial, sans-serif">TRAINING (learning)</text><text x="665" y="92" font-size="17" font-weight="bold" text-anchor="middle" fill="#0550ae" font-family="Segoe UI, Helvetica, Arial, sans-serif">INFERENCE (using)</text><rect x="55" y="120" width="130" height="60" rx="10" fill="#dafbe1" stroke="#4ac26b" stroke-width="2"/><text x="120.0" y="145.75" font-size="15" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">Large</text><text x="120.0" y="164.75" font-size="15" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">dataset</text><rect x="270" y="120" width="150" height="60" rx="10" fill="#ffe9d6" stroke="#fb8f44" stroke-width="2"/><text x="345.0" y="145.9" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">Model</text><text x="345.0" y="163.9" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">weights CHANGE</text><line x1="185" y1="150" x2="268" y2="150" stroke="#57606a" stroke-width="2.5" marker-end="url(#ar)"/><path d="M345,180 L345,222 L120,222 L120,182" fill="none" stroke="#57606a" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ar)"/><text x="232" y="214" font-size="12" font-weight="normal" text-anchor="middle" fill="#57606a" font-family="Segoe UI, Helvetica, Arial, sans-serif">error signal → update weights</text><text x="235" y="262" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">Slow and costly: days to months,</text><text x="235" y="279" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">specialised chips (GPUs / TPUs).</text><text x="235" y="296" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">Done by AI developers.</text><rect x="480" y="120" width="90" height="60" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="2"/><text x="525.0" y="145.75" font-size="15" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">Your</text><text x="525.0" y="164.75" font-size="15" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">prompt</text><rect x="615" y="120" width="130" height="60" rx="10" fill="#fbefff" stroke="#c297ff" stroke-width="2"/><text x="680.0" y="145.9" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">Model</text><text x="680.0" y="163.9" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">weights FROZEN</text><rect x="790" y="120" width="70" height="60" rx="10" fill="#dafbe1" stroke="#4ac26b" stroke-width="2"/><text x="825.0" y="155.25" font-size="15" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">Answer</text><line x1="570" y1="150" x2="613" y2="150" stroke="#57606a" stroke-width="2.5" marker-end="url(#ar)"/><line x1="745" y1="150" x2="788" y2="150" stroke="#57606a" stroke-width="2.5" marker-end="url(#ar)"/><text x="665" y="232" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">Fast and cheap per use:</text><text x="665" y="249" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">milliseconds to seconds.</text><text x="665" y="266" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">Happens every time you chat.</text><text x="235" y="330" font-size="13" font-weight="bold" text-anchor="middle" fill="#57606a" font-family="Segoe UI, Helvetica, Arial, sans-serif">Like: a student studying for years</text><text x="665" y="330" font-size="13" font-weight="bold" text-anchor="middle" fill="#57606a" font-family="Segoe UI, Helvetica, Arial, sans-serif">Like: the graduate answering a question</text><text x="450" y="382" font-size="14" font-weight="normal" text-anchor="middle" fill="#57606a" font-family="Segoe UI, Helvetica, Arial, sans-serif">Your chat does not retrain the model. It only supplies temporary context.</text>
</svg>