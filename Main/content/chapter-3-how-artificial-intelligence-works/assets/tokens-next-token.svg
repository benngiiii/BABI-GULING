<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Tokens and next-token prediction</title><desc id="d">Text is split into tokens, the model assigns probabilities to candidate next tokens, one is chosen and appended, and the process repeats.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="1" y="1" width="898" height="418" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<text x="450" y="36" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">How a language model reads and writes text</text><text x="36" y="82" font-size="15" font-weight="bold" text-anchor="start" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">1. Text is split into tokens, then into numbers</text><rect x="36" y="105" width="74" height="46" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="2"/><text x="73.0" y="132.9" font-size="14" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">Under</text><text x="73" y="180" font-size="13" font-weight="normal" text-anchor="middle" fill="#57606a" font-family="Segoe UI, Helvetica, Arial, sans-serif">8210</text><rect x="116" y="105" width="74" height="46" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="2"/><text x="153.0" y="132.9" font-size="14" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">standing</text><text x="153" y="180" font-size="13" font-weight="normal" text-anchor="middle" fill="#57606a" font-family="Segoe UI, Helvetica, Arial, sans-serif">5291</text><rect x="196" y="105" width="74" height="46" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="2"/><text x="233.0" y="132.9" font-size="14" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">·AI</text><text x="233" y="180" font-size="13" font-weight="normal" text-anchor="middle" fill="#57606a" font-family="Segoe UI, Helvetica, Arial, sans-serif">15592</text><rect x="276" y="105" width="74" height="46" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="2"/><text x="313.0" y="132.9" font-size="14" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">·is</text><text x="313" y="180" font-size="13" font-weight="normal" text-anchor="middle" fill="#57606a" font-family="Segoe UI, Helvetica, Arial, sans-serif">382</text><rect x="356" y="105" width="74" height="46" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="2"/><text x="393.0" y="132.9" font-size="14" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">·fun</text><text x="393" y="180" font-size="13" font-weight="normal" text-anchor="middle" fill="#57606a" font-family="Segoe UI, Helvetica, Arial, sans-serif">2523</text><text x="36" y="214" font-size="12" font-weight="normal" text-anchor="start" fill="#57606a" font-family="Segoe UI, Helvetica, Arial, sans-serif">(· marks a leading space. Token IDs are illustrative; real tokenizers differ.)</text><text x="470" y="82" font-size="15" font-weight="bold" text-anchor="start" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">2. The model scores every possible next token</text><text x="470" y="112" font-size="14" font-weight="normal" text-anchor="start" fill="#57606a" font-family="Segoe UI, Helvetica, Arial, sans-serif">Prompt: "The cat sat on the ___"</text><text x="560" y="150" font-size="14" font-weight="normal" text-anchor="end" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">mat</text><rect x="572" y="130" width="252" height="28" rx="5" fill="#dafbe1" stroke="#4ac26b" stroke-width="2"/><text x="832" y="150" font-size="14" font-weight="bold" text-anchor="start" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">42%</text><text x="560" y="190" font-size="14" font-weight="normal" text-anchor="end" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">floor</text><rect x="572" y="170" width="126" height="28" rx="5" fill="#ddf4ff" stroke="#54aeff" stroke-width="2"/><text x="706" y="190" font-size="14" font-weight="bold" text-anchor="start" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">21%</text><text x="560" y="230" font-size="14" font-weight="normal" text-anchor="end" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">sofa</text><rect x="572" y="210" width="84" height="28" rx="5" fill="#ddf4ff" stroke="#54aeff" stroke-width="2"/><text x="664" y="230" font-size="14" font-weight="bold" text-anchor="start" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">14%</text><text x="560" y="270" font-size="14" font-weight="normal" text-anchor="end" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">roof</text><rect x="572" y="250" width="48" height="28" rx="5" fill="#ddf4ff" stroke="#54aeff" stroke-width="2"/><text x="628" y="270" font-size="14" font-weight="bold" text-anchor="start" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">8%</text><text x="560" y="310" font-size="14" font-weight="normal" text-anchor="end" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">other tokens</text><rect x="572" y="290" width="90" height="28" rx="5" fill="#eaeef2" stroke="#afb8c1" stroke-width="2"/><text x="670" y="310" font-size="14" font-weight="bold" text-anchor="start" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">15%</text><line x1="30" y1="330" x2="870" y2="330" stroke="#d0d7de" stroke-width="2" stroke-dasharray="4 4"/><text x="450" y="365" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">3. One token is picked (randomness is controlled by temperature), added to the text, and the loop repeats.</text><text x="450" y="392" font-size="13" font-weight="normal" text-anchor="middle" fill="#57606a" font-family="Segoe UI, Helvetica, Arial, sans-serif">Everything an LLM writes is produced one token at a time, by this loop.</text>
</svg>