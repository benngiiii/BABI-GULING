<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="860" height="340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Attention in a transformer</title><desc id="d">Arcs from the word it to the words animal, tired and street show how strongly the model attends to each when interpreting it.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="1" y="1" width="858" height="338" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<text x="430" y="36" font-size="21" font-weight="bold" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">Attention: which words matter when interpreting “it”?</text><rect x="608" y="225" width="52" height="34" rx="8" fill="#fff8c5" stroke="#d4a72c" stroke-width="2"/><text x="60" y="248" font-size="16" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">The</text><text x="142" y="248" font-size="16" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">animal</text><text x="224" y="248" font-size="16" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">didn't</text><text x="306" y="248" font-size="16" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">cross</text><text x="388" y="248" font-size="16" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">the</text><text x="470" y="248" font-size="16" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">street</text><text x="552" y="248" font-size="16" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">because</text><text x="634" y="248" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">it</text><text x="716" y="248" font-size="16" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">was</text><text x="798" y="248" font-size="16" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">tired</text><path d="M634,215 Q388.0,-55.60000000000002 142,215" fill="none" stroke="#1a7f37" stroke-width="7" stroke-linecap="round" opacity="0.85"/><text x="388" y="70" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a7f37" font-family="Segoe UI, Helvetica, Arial, sans-serif">78%</text><path d="M634,215 Q716.0,124.8 798,215" fill="none" stroke="#0969da" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/><text x="716" y="160" font-size="14" font-weight="bold" text-anchor="middle" fill="#0969da" font-family="Segoe UI, Helvetica, Arial, sans-serif">14%</text><path d="M634,215 Q552.0,124.8 470,215" fill="none" stroke="#8c959f" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/><text x="552" y="160" font-size="14" font-weight="bold" text-anchor="middle" fill="#8c959f" font-family="Segoe UI, Helvetica, Arial, sans-serif">8%</text><text x="430" y="292" font-size="13" font-weight="normal" text-anchor="middle" fill="#57606a" font-family="Segoe UI, Helvetica, Arial, sans-serif">Thicker arc = stronger attention. Percentages are illustrative.</text><text x="430" y="316" font-size="13" font-weight="normal" text-anchor="middle" fill="#57606a" font-family="Segoe UI, Helvetica, Arial, sans-serif">The model learns that “it” most likely refers to “animal”, so it can build the right meaning.</text>
</svg>