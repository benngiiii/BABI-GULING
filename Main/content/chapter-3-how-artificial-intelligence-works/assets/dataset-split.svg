<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Dataset split</title><desc id="d">A dataset is divided into 70 percent training, 15 percent validation and 15 percent test data.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="1" y="1" width="898" height="328" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<text x="450" y="38" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">Splitting a dataset: train, validate, test</text><text x="450" y="90" font-size="14" font-weight="bold" text-anchor="middle" fill="#57606a" font-family="Segoe UI, Helvetica, Arial, sans-serif">Full dataset</text><rect x="60" y="105" width="546.0" height="60" rx="10" fill="#dafbe1" stroke="#4ac26b" stroke-width="2"/><text x="333.0" y="140.25" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">Training 70%</text><rect x="606.0" y="105" width="117.0" height="60" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="2"/><text x="664.5" y="140.25" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">Val 15%</text><rect x="723.0" y="105" width="117.0" height="60" rx="10" fill="#ffebe9" stroke="#ff8182" stroke-width="2"/><text x="781.5" y="140.25" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">Test 15%</text><text x="333" y="205" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">Textbook</text><text x="333" y="222" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">The model learns from this</text><text x="664" y="205" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">Practice quiz</text><text x="664" y="222" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">Tune settings,</text><text x="664" y="239" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">compare versions</text><text x="782" y="205" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">Final exam</text><text x="782" y="222" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">Use once, at the end</text><text x="450" y="300" font-size="14" font-weight="normal" text-anchor="middle" fill="#57606a" font-family="Segoe UI, Helvetica, Arial, sans-serif">Rule: test data must never influence training. Otherwise the final score is inflated (data leakage).</text>
</svg>