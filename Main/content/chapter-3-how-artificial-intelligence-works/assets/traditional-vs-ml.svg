<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Traditional programming vs machine learning</title><desc id="d">Traditional programs take rules and input to produce output. Machine learning takes data and correct answers to produce rules, called a model.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="1" y="1" width="898" height="408" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<text x="450" y="38" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">Traditional programming vs. machine learning</text><text x="40" y="66" font-size="13" font-weight="bold" text-anchor="start" fill="#57606a" font-family="Segoe UI, Helvetica, Arial, sans-serif">TRADITIONAL PROGRAMMING</text><rect x="40" y="80" width="200" height="46" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="2"/><text x="140.0" y="98.9" font-size="14" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">Rules</text><text x="140.0" y="116.9" font-size="14" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">(hand-written)</text><rect x="40" y="138" width="200" height="46" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="2"/><text x="140.0" y="165.9" font-size="14" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">Input data</text><rect x="330" y="95" width="200" height="75" rx="10" fill="#fbefff" stroke="#c297ff" stroke-width="2"/><text x="430.0" y="137.75" font-size="15" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">Program</text><rect x="640" y="95" width="200" height="75" rx="10" fill="#dafbe1" stroke="#4ac26b" stroke-width="2"/><text x="740.0" y="128.25" font-size="15" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">Output</text><text x="740.0" y="147.25" font-size="15" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">(answer)</text><line x1="240" y1="103" x2="328" y2="124" stroke="#57606a" stroke-width="2.5" marker-end="url(#ar)"/><line x1="240" y1="161" x2="328" y2="142" stroke="#57606a" stroke-width="2.5" marker-end="url(#ar)"/><line x1="530" y1="132" x2="638" y2="132" stroke="#57606a" stroke-width="2.5" marker-end="url(#ar)"/><line x1="40" y1="212" x2="860" y2="212" stroke="#d0d7de" stroke-width="2" stroke-dasharray="4 4"/><text x="40" y="240" font-size="13" font-weight="bold" text-anchor="start" fill="#57606a" font-family="Segoe UI, Helvetica, Arial, sans-serif">MACHINE LEARNING</text><rect x="40" y="254" width="200" height="46" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="2"/><text x="140.0" y="281.9" font-size="14" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">Data (examples)</text><rect x="40" y="312" width="200" height="46" rx="10" fill="#dafbe1" stroke="#4ac26b" stroke-width="2"/><text x="140.0" y="330.9" font-size="14" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">Correct answers</text><text x="140.0" y="348.9" font-size="14" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">(labels)</text><rect x="330" y="269" width="200" height="75" rx="10" fill="#fbefff" stroke="#c297ff" stroke-width="2"/><text x="430.0" y="302.25" font-size="15" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">Learning</text><text x="430.0" y="321.25" font-size="15" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">algorithm</text><rect x="640" y="269" width="200" height="75" rx="10" fill="#ffe9d6" stroke="#fb8f44" stroke-width="2"/><text x="740.0" y="302.25" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">Learned rules</text><text x="740.0" y="321.25" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">= the MODEL</text><line x1="240" y1="277" x2="328" y2="298" stroke="#57606a" stroke-width="2.5" marker-end="url(#ar)"/><line x1="240" y1="335" x2="328" y2="316" stroke="#57606a" stroke-width="2.5" marker-end="url(#ar)"/><line x1="530" y1="306" x2="638" y2="306" stroke="#57606a" stroke-width="2.5" marker-end="url(#ar)"/><text x="450" y="388" font-size="14" font-weight="normal" text-anchor="middle" fill="#57606a" font-family="Segoe UI, Helvetica, Arial, sans-serif">In ML the roles flip: you supply data and answers, and the computer discovers the rules.</text>
</svg>